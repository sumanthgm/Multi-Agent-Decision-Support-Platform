[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm-agentic"
version = "0.1.0"
description = "Agentic AI multi-agent decision support platform for industrial IoT predictive maintenance (inverters and pump drives)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "xgboost", "pyyaml", "matplotlib"]

[project.optional-dependencies]
baseline = ["torch"]
serve = ["fastapi", "uvicorn", "requests", "streamlit", "plotly", "httpx"]
forecast = ["chronos-forecasting"]
dev = ["pytest", "ipykernel", "nbformat", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
